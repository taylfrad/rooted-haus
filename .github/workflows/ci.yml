name: CI

on:
  pull_request:
  push: # every branch, main included (Cloudflare Pages builds main itself, this is the readable check)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web check
      - run: pnpm --filter web build
        env: # same settings as the Cloudflare Pages production build
          SITE_URL: https://rooted-haus.com
      - name: No pure black or white colors
        run: |
          if grep -rEn '#000\b|#fff\b|#000000|#ffffff|:\s*(black|white)\b' web/src --include=*.astro --include=*.css --include=*.ts; then
            echo "Pure black/white found; use palette tokens (client requirement)."; exit 1
          fi
