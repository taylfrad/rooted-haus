name: Deploy staging to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *' # nightly, so dated deals start and expire on time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web check
      # Asks GitHub where this Pages site actually lives, so moving the repo to another account or
      # connecting a custom domain needs no edits here: <account>.github.io/rooted-haus builds under
      # /rooted-haus (staging, hidden from search), a custom domain builds at the root (live, indexed).
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm --filter web build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
