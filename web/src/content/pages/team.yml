seo:
  title: "Meet the Haus · The Rooted Haus"
  description: "Our mission and the stylists of The Rooted Haus, a holistic hair studio in Mandeville, Louisiana, rooted in wellness and centered by faith."
header:
  eyebrow: "Meet the Haus"
  script: "our roots"
  title: "The hands and hearts of our foundation"
  intro: "Just as every living thing depends on its roots to grow and flourish, The Rooted Haus also depends on ours. Meet the hands and hearts of our foundation who help nurture and grow our Haus, bringing our vision of beauty and wellness to life."
  image: "../../assets/photos/group/group-portrait.jpg"
  alt: "The six stylists of The Rooted Haus together in front of the product shelves."
band:
  image: "../../assets/photos/group/group-sofa.jpg"
  alt: "The stylists gathered around a tufted settee and velvet armchair in the lounge."
mission:
  label: "Our roots · our mission"
  text: "We help natural minded women nurture their low-tox dream lifestyles by offering personalized hair care services rooted in wellness and centered by faith while making each guest feel like they have stepped into an extension of their home."
vision:
  label: "Our vision"
  text: "To lead a movement toward intentional, wellness-centered beauty, where women never have to sacrifice their health to feel beautiful, cared for, and confident."
about:
  label: "A little about us"
  paragraphs:
    - "At the Rooted Haus we believe in wellness through mind, body, and spirit. When you look amazing, you feel amazing. Here beauty is more than a service, it’s an experience rooted in wellness, authenticity, and faith. We wanted this salon to be a sanctuary for women to feel not only cared for on the outside, but nourished on the inside. Our hearts have always been to combine our love for the industry with the deeper calling to serve: to encourage, uplift, and create a space where our clients feel nurtured and valued."
    - "Every detail of our salon is inspired by the beauty of nature in a way that feels like home. Here, self care is sacred. Whether you are looking for an elevated color service, low-tox hair products and methods, or time to unwind with one of our rejuvenating scalp rituals, we promise you’ll leave feeling lighter, more radiant, and more rooted in who you are."
