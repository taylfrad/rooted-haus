seo:
  title: "Plant Your Roots: careers · The Rooted Haus"
  description: "Join The Rooted Haus in Mandeville: commission, booth rental and hourly opportunities in a calm, low-tox salon."
header:
  eyebrow: "Plant your roots"
  script: "come grow with us"
  title: "Plant your roots and come grow with us!"
  image: "../../assets/photos/services/img-9947.jpg"
  alt: "A stylist in a wide-brim hat paints in foils for a smiling client."
badge: "Now hiring"
intro: "Our salon home is growing and we are always looking for wellness-minded people to join our team. More than anything we have an amazing group of girls who genuinely support, encourage, celebrate, and pray for one another. If you are looking for a salon that values community over competition, and are looking to detox your work environment, we’d love to meet you!"
offer: "We offer both commission and booth rental opportunities."
teamButton: "Meet the Haus"
photo:
  image: "../../assets/photos/stylists/img-9934.jpg"
  alt: "Sadie laughs as she spins in a salon chair."
  focus: "50% 30%"
photo2:
  image: "../../assets/photos/salon/img-0194.jpg"
  alt: "Two leather armchairs in front of a floral wallpaper wall hung with small frames and woven pieces."
photos:
  - image: "../../assets/photos/salon/img-0180.jpg"
    alt: "The front desk, with a welcome screen, gold mirror and fresh flowers beneath a landscape painting."
    focus: "50% 30%"
  - image: "../../assets/photos/salon/color-bar.jpg"
    alt: "The color bar: tall wooden shelves of color tubes, baskets, books and trailing greenery."
    focus: "50% 45%"
values:
  title: "Culture and core values"
  items:
    - title: "Faith at our foundation"
      text: "At the Rooted Haus we believe true beauty begins within. Our faith in Christ is the foundation of our business, guiding us to serve others with grace, integrity, humility, and most importantly, love."
    - title: "Beauty without compromise"
      text: "We believe beauty and wellness should go hand in hand and are committed to thoughtful ingredients, transparency, low-tox alternatives, and intentional practices that prioritize the well-being of our guests and our stylists."
    - title: "Growth with purpose"
      text: "We believe growth is a lifelong journey, in our faith, in our health, and in our careers. Through continued education, encouragement, and community, we strive to create an environment where our stylists can flourish personally, professionally, and spiritually. We recognize that growth looks different for everyone and are dedicated to nurture each stylist’s unique path through mentorship and support in pursuing their individual goals."
perksTitle: "Perks of working in our salon"
perks:
  - "Flexibility in choosing schedule"
  - "Clean and cozy salon space"
  - "Great lighting"
  - "Calm low-tox environment"
  - "Top tier online booking system"
  - "Annual brand photo shoots"
  - "Ample parking"
  - "Comfortable space/floor mats"
  - "Continuing education"
  - "Premium low-tox backbar products"
commissionTitle: "Commission stylists"
commission:
  - "Flexibility in choosing schedule"
  - "Low staff turnover"
  - "Uncapped commissions"
  - "Social media coaching and content support"
  - "Unlimited time off"
  - "New clients monthly"
  - "Choice and support in continuing education"
boothRentalTitle: "Booth rentals"
boothRentalPrice: "$300/week"
boothRental:
  - "Prorated daily rates for part time stylists"
  - "Plenty of storage"
  - "1 week of free rent yearly"
  - "Flexibility in choosing schedule"
hourlyTitle: "Hourly roles"
hourlyPrice: "Starting at $12/hour"
hourlyRoles:
  - "Salon Assistant"
  - "Front Desk Coordinator"
quotesEyebrow: "Life at the Haus"
quotesTitle: "Here’s what *our stylists* have to say!"
stylistQuotes:
  - quote: "I love working in an atmosphere where I feel seen, heard, and supported. Where the goal is to grow each stylist!"
    name: "Ashley"
  - quote: "As a Christian, my faith is an important part of who I am and I'm grateful to work in an environment where those values are appreciated."
    name: "Bridgette"
apply:
  title: "Apply to join the Haus"
  text: "Tell us about yourself and what you are looking for. A resume is welcome but not required."
  stepsTitle: "What happens next"
  startScript: "come grow with us"
  startTitle: "Ready to plant your roots?"
  startText: "It takes about five minutes, and you can attach your resume if you have one."
  startButton: "Start your application"
  thanksTitle: "Thank you for applying!"
  thanksText: "We have your application and will be in touch shortly."
  experienceOptions:
    - "Student"
    - "Less than 2 years"
    - "2 to 5 years"
    - "6 or more years"
  licenseOptions:
    - "Licensed"
    - "In school"
    - "Not yet"
  steps:
    - title: "Say hello"
      text: "Reach out and tell us a little about yourself and the role you are interested in."
    - title: "Come see the Haus"
      text: "We will invite you in to meet the team, see the space and talk through what you are looking for."
    - title: "Find your fit"
      text: "Commission, booth rental or hourly: together we will work out which path suits you best."
