body: "We also believe in leaving a little margin for magic. That’s why we intentionally build flexibility into our services, allowing room for those last minute rituals whenever possible. Whether you are wanting to add a gloss to your haircut appointment or an express scalp treatment, we will always do our best to accommodate you."
