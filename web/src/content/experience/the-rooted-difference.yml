wide: true
items:
  - title: "A breath of fresh air"
    text: "Our salon is filled with greenery, natural elements, and fresh air whenever possible. We love opening our doors and inviting the outdoors in, creating a space that feels as refreshing as it looks."
  - title: "Rooted in scalp wellness"
    text: "Healthy hair begins at the root. Our personalized scalp care services and restorative rituals are designed to nourish the scalp, support healthy hair, and encourage moments of rest and renewal."
  - title: "Low-tox hair color"
    text: "We offer beautiful color without unnecessary compromises. We have carefully selected color lines that are formulated without ammonia, resorcinol, PPD, or gluten, and are Leaping Bunny certified and cruelty free."
  - title: "Clean beauty and full transparency"
    text: "We believe you deserve to know exactly what’s in the products being used on your scalp. That’s why we work with brands committed to complete ingredient transparency."
  - title: "Naturally fragrant, never artificial"
    text: "You’ll never find synthetic air fresheners or artificially fragranced products intentionally used to scent our space. Instead, we choose high-quality, pure essential oils in our diffusers to create a soft and relaxing atmosphere."
  - title: "A cleaner kind of clean"
    text: "Our commitment to low-tox living goes far beyond hair care. From our hand soaps, lotions, and surface cleaners, to the detergents used to wash our towels and smocks, we intentionally choose products with thoughtfully selected ingredients, avoiding harsh chemicals and unnecessary synthetic fragrances."
