items:
  - title: "All in the details"
    text: "We’ve thought of all the little things so you don’t have to. Whether you need a workstation for your lap so you can stay on the job while you enjoy your appointment, access to wifi, a charger for your phone or laptop, or a little lotion, we’ve got you covered. Need a cold place to store breast milk or someone to heat up your lunch for you? We’re happy to help! And for those longer appointments, if you forgot to bring your lunch or need something a little more than our snacks, we’ll even order lunch and pick it up for you!"
  - title: "Rejuvenating scalp massage"
    text: "Every appointment includes a 5 minute scalp massage during your shampoo experience. Firm pressure is gently focused around the hairline, base of the skull, and neck to release tension, allowing you to completely relax. (For anyone averse to touch, please let us know and we will skip this step.)"
  - title: "Room to bloom"
    text: "We also believe in leaving a little margin for magic. That’s why we intentionally build flexibility into our services, allowing room for those last minute rituals whenever possible. Whether you are wanting to add a gloss to your haircut appointment or an express scalp treatment to your blowout, we will always do our best to accommodate you."
  - title: "Full complimentary styling"
    text: "All services (excluding bang trims and express styling) include a blowout, as well as optional hot tool styling to finish your appointment. Not only do we want you to leave feeling your absolute best, but this gives us a chance to refine your haircut after your blowout for the most flawless result."
  - title: "Ongoing education"
    text: "As long as you are a guest in our salon, you will never have to wonder how to achieve salon quality hair at home. Our goal is to set you up for success. From product knowledge for your specific hair type, to how to curl your hair, to all the little tips and tricks you can do at home to achieve the same style, we won’t leave you hanging!"
